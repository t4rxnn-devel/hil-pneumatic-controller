name: Universal Firmware CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: PlatformIO Core Build & Simulation Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache PlatformIO Core & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Run Embedded Firmware Build (Teensy Target)
        run: pio run -d firmware/

      - name: Run Simulation Suite Unit Tests
        run: |
          python -m unittest discover -s simulation/ -p "*.py" || echo "No unit tests found, skipping."

      - name: Archive Compiled Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-firmware-binaries
          path: |
            firmware/.pio/build/**/firmware.hex
            firmware/.pio/build/**/firmware.bin
          retention-days: 90
